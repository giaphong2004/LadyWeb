<div [formGroup]="parentForm">
  <div class="main-column">
    <div class="card">

      <div class="form-group">
        <label for="expert-title">Chức danh</label>
        <input type="text" id="expert-title" class="form-control" formControlName="title">
      </div>

      <div class="form-group">
        <label for="expert-bio">Tiểu sử</label>
        <textarea id="expert-bio" class="form-control" rows="8" formControlName="bio"></textarea>
      </div>

      <div class="form-group">
        <label for="expert-qualifications">Bằng cấp & Chuyên môn</label>
        <textarea id="expert-qualifications" class="form-control" rows="5"
          placeholder="Liệt kê các bằng cấp, chứng chỉ, mỗi mục một dòng..."
          formControlName="qualifications"></textarea>
      </div>
    </div>
  </div>
</div>
