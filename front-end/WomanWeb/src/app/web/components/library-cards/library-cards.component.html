<div class="row">
  <div class="col-md-6 col-lg-4" *ngFor="let post of posts">
    <div class="article-card">
      <img [src]="post.cover_image_url || 'https://via.placeholder.com/400x250'" class="card-img-top"
        [alt]="post.title">
      <div class="card-body">
        <span class="category-tag">{{ post.Tags[0]?.name }}</span>
        <h5 class="card-title"><a [routerLink]="['/posts', post.slug]">{{ post.title }}</a></h5>
        <p class="card-text">{{ post.content | slice:0:12 }}...</p>
      </div>
      <div class="card-footer">
        <span>Bởi <strong>{{ post.author?.full_name }}</strong></span>
      </div>
    </div>
  </div>
</div>

<div *ngIf="!posts || posts.length === 0">
  <p>Không tìm thấy bài viết nào phù hợp.</p>
</div>
