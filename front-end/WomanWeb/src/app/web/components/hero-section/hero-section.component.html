<!-- Hero Section -->
<section class="bg-white">
  <div class="container col-xxl-8 px-4 py-5">
    <div class="row flex-lg-row-reverse align-items-center g-5 py-5">
      <div class="col-10 col-sm-8 col-lg-6">
        <img src="/assets/img/side-bar.jpg" class="d-block mx-lg-auto img-fluid rounded-3 shadow-lg"
          alt="Người phụ nữ mỉm cười" loading="eager">
      </div>
      <div class="col-lg-6">
        <h1 class="display-5 fw-bold lh-1 mb-3">
          <span class="text-pink-dark">Sức Khỏe Của Bạn,</span><br />
          <span class="text-secondary">Hành Trình Của Bạn.</span>
        </h1>
        <p class="lead">Nắm quyền kiểm soát sức khỏe của bạn với tính năng theo dõi chu kỳ được cá nhân hóa,
          lời
          khuyên sức khỏe từ chuyên gia và một cộng đồng hỗ trợ. Tất cả ở cùng một nơi.</p>
        <div class="d-grid gap-2 d-md-flex justify-content-md-start">
          <a routerLink="/login" [queryParams]="{ view: 'signup' }"><button type="button"
              class="btn btn-pink btn-lg px-4 me-md-2">Tạo
              tài khoản
              miễn phí</button></a>
          <button type="button" class="btn btn-outline-secondary btn-lg px-4">Khám phá tính năng</button>
        </div>
      </div>
    </div>
  </div>
</section>
