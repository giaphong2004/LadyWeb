<div class="experts-grid" *ngIf="experts && experts.length > 0">

  <div class="expert-card" *ngFor="let expert of experts">
    <div class="expert-avatar">
      <img [src]="expert.avatar_url || 'https://i.pravatar.cc/100'" [alt]="expert.full_name">
    </div>
    <div class="expert-info">
      <h4 class="expert-name">{{ expert.full_name }}</h4>
      <p class="expert-specialty">{{ expert.ExpertProfile?.title }}</p>
      <p class="expert-desc">{{ expert.ExpertProfile?.bio }}</p>
    </div>
    <div class="expert-actions">
      <a href="#" (click)="editRequest.emit(expert); $event.preventDefault()" title="Sửa"><i
          class="fas fa-edit"></i></a>
      <a href="#" (click)="deleteRequest.emit(expert); $event.preventDefault()" title="Xóa"><i
          class="fas fa-trash"></i></a>
    </div>
  </div>

</div>

<div *ngIf="!experts || experts.length === 0">
  <p>Chưa có chuyên gia nào trong hệ thống.</p>
</div>
