<div class="page-header">
  <h1>Quản lý Chuyên gia</h1>
  <a href="#" (click)="openModal(); $event.preventDefault()" id="add-expert-btn" class="btn btn-primary"><i
      class="fas fa-plus"></i> Thêm chuyên gia</a>
</div>

<div [ngClass]="{'active': isModalVisible}" id="add-expert-modal" class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Thêm Chuyên gia mới</h3>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>
    <form class="modal-form" [formGroup]="expertForm" (ngSubmit)="onFormSubmit()">
      <div class="form-group">
        <label>Ảnh đại diện</label>
        <div class="avatar-upload-container">
          <img [src]="expertForm.get('avatarUrl')?.value || 'https://ik.imagekit.io/ikmedia/placeholder.png'"
            alt="Avatar Preview" class="avatar-preview">
          <input type="file" (change)="onFileSelected($event)" #fileInput hidden>
          <button type="button" class="btn btn-secondary" (click)="fileInput.click()" [disabled]="isUploadingAvatar">
            {{ isUploadingAvatar ? 'Đang tải lên...' : 'Chọn ảnh' }}
          </button>
        </div>
        <div *ngIf="expertForm.get('avatarUrl')?.hasError('required') && expertForm.get('avatarUrl')?.touched"
          class="error-text">
          Vui lòng chọn ảnh đại diện.
        </div>
      </div>

      <div class="form-group">
        <label for="expert-email">Email</label>
        <input type="text" id="expert-email" placeholder="email@example.com" formControlName="email">
      </div>
      <div class="form-group">
        <label for="expert-name">Tên chuyên gia</label>
        <input type="text" id="expert-name" placeholder="BS. Nguyễn Thị A" formControlName="fullName">
      </div>
      <div class="form-group">
        <label for="expert-title">Chức danh</label>
        <input type="text" id="expert-title" placeholder="Bác sĩ Sản phụ khoa" formControlName="title">
      </div>
      <div class="form-group">
        <label for="expert-bio">Tiểu sử/Kinh nghiệm</label>
        <textarea id="expert-bio" rows="4" placeholder="Mô tả ngắn về chuyên gia..." formControlName="bio"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary cancel-btn" (click)="closeModal()">Hủy</button>
        <button type="submit" class="btn btn-primary" [disabled]="expertForm.invalid">Thêm chuyên gia</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal sửa chuyên gia -->
<div [ngClass]="{'active': isPanelVisible}" id="edit-expert-modal" class="modal-overlay" (click)="closeEditPanel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Sửa thông tin chuyên gia</h3>
      <button class="close-btn" (click)="closeEditPanel()">&times;</button>
    </div>
    <form class="modal-form" [formGroup]="expertForm" (ngSubmit)="onFormSubmit()">
      <div class="form-group">
        <label>Ảnh đại diện</label>
        <div class="avatar-upload-container">
          <img [src]="expertForm.get('avatarUrl')?.value || 'https://ik.imagekit.io/ikmedia/placeholder.png'"
            alt="Avatar Preview" class="avatar-preview">
          <input type="file" (change)="onFileSelected($event)" #fileInput hidden>
          <button type="button" class="btn btn-secondary" (click)="fileInput.click()" [disabled]="isUploadingAvatar">
            {{ isUploadingAvatar ? 'Đang tải lên...' : 'Chọn ảnh' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" readonly><br>
        <small class="text-muted">Email không thể thay đổi</small>
      </div>
      <div class="form-group">
        <label for="fullName">Họ và tên</label>
        <input type="text" id="fullName" formControlName="fullName">
      </div>
      <div class="form-group">
        <label for="title">Chức danh</label>
        <input type="text" id="title" formControlName="title">
      </div>
      <div class="form-group">
        <label for="bio">Mô tả</label>
        <textarea id="bio" formControlName="bio" rows="3"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary cancel-btn" (click)="closeEditPanel()">Hủy</button>
        <button type="submit" class="btn btn-primary" [disabled]="expertForm.invalid">Cập nhật</button>
      </div>
    </form>
  </div>
</div>
