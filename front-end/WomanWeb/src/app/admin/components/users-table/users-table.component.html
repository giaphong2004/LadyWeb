<table class="content-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>TÊN ĐẦY ĐỦ</th>
      <th>EMAIL</th>
      <th>VAI TRÒ</th>
      <th>NGÀY THAM GIA</th>
      <th>HÀNH ĐỘNG</th>
    </tr>
  </thead>
  <tbody *ngIf="users.length > 0">
    <tr *ngFor="let user of users">
      <td>{{ user.id }}</td>
      <td>{{ user.full_name }}</td>
      <td>{{ user.email }}</td>
      <td>
        <span class="role-tag" [ngClass]="{
          'role-admin': user.role === 'admin',
          'role-expert': user.role === 'expert',
          'role-member': user.role === 'user'
        }">
          {{ user.role | titlecase }}
        </span>
      </td>
      <td>{{ user.created_at | date: 'dd/MM/yyyy' }}</td>
      <td class="action-icons">
        <a href="#" (click)="editRequest.emit(user); $event.preventDefault()" title="Sửa"><i
            class="fas fa-edit"></i></a>
        <a href="#" (click)="deleteRequest.emit(user); $event.preventDefault()" title="Xóa"><i
            class="fas fa-trash"></i></a>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="users.length === 0">
  <p>Không có người dùng nào trong hệ thống.</p>
</div>
