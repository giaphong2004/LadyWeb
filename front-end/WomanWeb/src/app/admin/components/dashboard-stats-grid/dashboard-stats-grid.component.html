<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-icon-wrapper icon-blue">
      <i class="fas fa-users"></i>
    </div>
    <div class="stat-info">
      <span class="stat-title">Tổng số người dùng</span>
      <span class="stat-value">{{ stats.totalUsers || 0 }}</span>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon-wrapper icon-green">
      <i class="fas fa-user-plus"></i>
    </div>
    <div class="stat-info">
      <span class="stat-title">Người dùng mới (Tháng)</span>
      <span class="stat-value">{{ stats.newUsersThisMonth || 0 }}</span>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon-wrapper icon-purple">
      <i class="fas fa-file-alt"></i>
    </div>
    <div class="stat-info">
      <span class="stat-title">Tổng số bài viết</span>
      <span class="stat-value">{{ stats.totalPosts || 0 }}</span>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon-wrapper icon-yellow">
      <i class="fas fa-edit"></i>
    </div>
    <div class="stat-info">
      <span class="stat-title">Bài viết nháp</span>
      <span class="stat-value">{{ stats.draftPosts || 0 }}</span>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon-wrapper icon-success">
      <i class="fas fa-check-circle"></i>
    </div>
    <div class="stat-info">
      <span class="stat-title">Bài viết đã xuất bản</span>
      <span class="stat-value">{{ stats.publishedPosts || 0 }}</span>
    </div>
  </div>
</div>
